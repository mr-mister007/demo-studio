<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DemoStudio — Product Demo Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* ═══════════════════════════════════════════════════════════════
       DemoStudio Dashboard — Google Material 3 (Material You) Theme
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --md-sys-color-primary: #005ac1;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d8e2ff;
      --md-sys-color-on-primary-container: #001a41;
      --md-sys-color-surface: #fdfcff;
      --md-sys-color-surface-dim: #ded8e1;
      --md-sys-color-surface-container: #f0f3fa;
      --md-sys-color-surface-container-low: #f7f9ff;
      --md-sys-color-surface-container-high: #e8ecf4;
      --md-sys-color-surface-container-highest: #dfe3ea;
      --md-sys-color-on-surface: #1a1c1e;
      --md-sys-color-on-surface-variant: #43474e;
      --md-sys-color-outline: #74777f;
      --md-sys-color-outline-variant: #c4c6cf;
      --md-sys-color-secondary-container: #dbe2f9;
      --md-sys-color-on-secondary-container: #151b2c;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.06), 0 1px 2px 0 rgba(0,0,0,0.1);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.08), 0 1px 2px 0 rgba(0,0,0,0.12);
      --md-elevation-3: 0 4px 12px 3px rgba(0,0,0,0.1), 0 2px 4px 0 rgba(0,0,0,0.14);
      --md-shape-corner-full: 9999px;
      --md-shape-corner-large: 20px;
      --md-shape-corner-medium: 14px;
      --md-shape-corner-small: 8px;
    }

    body.theme-dark {
      --md-sys-color-primary: #a8c7fa;
      --md-sys-color-on-primary: #062e6f;
      --md-sys-color-primary-container: #0842a0;
      --md-sys-color-on-primary-container: #d3e3fd;
      --md-sys-color-surface: #111318;
      --md-sys-color-surface-dim: #111318;
      --md-sys-color-surface-container: #1e1f25;
      --md-sys-color-surface-container-low: #191a20;
      --md-sys-color-surface-container-high: #282a30;
      --md-sys-color-surface-container-highest: #33353b;
      --md-sys-color-on-surface: #e2e2e9;
      --md-sys-color-on-surface-variant: #c4c6d0;
      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #44474f;
      --md-sys-color-secondary-container: #3d4758;
      --md-sys-color-on-secondary-container: #d9e3f8;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.25), 0 1px 2px 0 rgba(0,0,0,0.35);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.28), 0 1px 2px 0 rgba(0,0,0,0.4);
      --md-elevation-3: 0 6px 14px 4px rgba(0,0,0,0.35), 0 2px 4px 0 rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .2s, color .2s;
    }

    /* ── App Bar ──────────────────────────────────────────────── */
    .app-bar {
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .app-bar-center {
      flex: 1;
      max-width: 520px;
      margin: 0 32px;
    }
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--md-sys-color-outline);
      font-size: 20px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 44px;
      border-radius: var(--md-shape-corner-full);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 2px rgba(0, 90, 193, 0.15);
    }

    .app-bar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .icon-btn:hover {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }

    .btn-filled {
      height: 40px;
      padding: 0 20px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .15s;
      box-shadow: var(--md-elevation-1);
    }
    .btn-filled:hover {
      box-shadow: var(--md-elevation-2);
      filter: brightness(1.06);
    }

    /* ── Main Layout ─────────────────────────────────────────── */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 28px;
      width: 100%;
      flex: 1;
    }

    /* ── Executive Metrics Row ───────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .metric-card {
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-large);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform .15s, box-shadow .15s;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--md-elevation-1);
    }
    .metric-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: var(--md-shape-corner-medium);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .metric-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      line-height: 1.1;
    }
    .metric-label {
      font-size: 12.5px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 4px;
    }

    /* ── Filter & Subhead Bar ────────────────────────────────── */
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
    }
    .chip {
      height: 32px;
      padding: 0 14px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
    }
    .chip:hover {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    .chip.active {
      background: var(--md-sys-color-primary-container);
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary-container);
    }

    .count-label {
      font-size: 13px;
      color: var(--md-sys-color-outline);
    }

    /* ── Demos Grid ──────────────────────────────────────────── */
    .demos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .demo-card {
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-large);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all .15s;
      box-shadow: var(--md-elevation-1);
    }
    .demo-card:hover {
      border-color: var(--md-sys-color-primary);
      box-shadow: var(--md-elevation-3);
      transform: translateY(-3px);
    }

    .demo-card-head {
      height: 120px;
      background: var(--md-sys-color-surface-container-highest);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .demo-card-head-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-domain-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: var(--md-shape-corner-full);
      background: rgba(0,0,0,0.3);
      color: #ffffff;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .demo-status-badge {
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: var(--md-shape-corner-full);
      letter-spacing: 0.02em;
    }
    .status-published {
      background: #c4eed0;
      color: #075323;
    }
    .status-draft {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .demo-card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .demo-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .demo-desc {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.5;
      margin-bottom: 18px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .demo-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--md-sys-color-outline);
      margin-bottom: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .demo-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .action-group-left {
      display: flex;
      gap: 8px;
    }
    .btn-tonal {
      height: 36px;
      padding: 0 14px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border: none;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
    }
    .btn-tonal:hover {
      background: #0b57d0;
      color: #ffffff;
    }
    .btn-outlined {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--md-shape-corner-full);
      background: none;
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface);
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s;
    }
    .btn-outlined:hover {
      background: var(--md-sys-color-surface-container-highest);
      border-color: var(--md-sys-color-outline);
    }

    /* ── Modal Dialog ────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-card {
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 28px;
      padding: 28px;
      width: 520px;
      max-width: 100%;
      box-shadow: var(--md-elevation-3);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .field-group {
      margin-bottom: 18px;
    }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .text-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: var(--md-shape-corner-medium);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .text-input:focus {
      border-color: var(--md-sys-color-primary);
    }
    .presets-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .preset-pill {
      font-size: 11.5px;
      padding: 3px 10px;
      border-radius: var(--md-shape-corner-full);
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      transition: all .12s;
    }
    .preset-pill:hover {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    /* ── Empty State ─────────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      padding: 64px 20px;
      text-align: center;
      background: var(--md-sys-color-surface-container);
      border: 1px dashed var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-large);
    }
    .empty-icon {
      font-size: 48px;
      color: var(--md-sys-color-outline);
      margin-bottom: 12px;
    }
    .empty-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 6px;
    }
    .empty-sub {
      font-size: 13.5px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 20px;
    }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--md-sys-color-on-surface);
      color: var(--md-sys-color-surface);
      padding: 10px 18px;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: var(--md-elevation-3);
      z-index: 2000;
    }
  </style>
</head>
<body>
  <!-- Top App Bar -->
  <header class="app-bar">
    <div class="brand-section">
      <div class="brand-icon">
        <span class="material-symbols-outlined" style="font-size:22px;">auto_awesome_motion</span>
      </div>
      <div class="brand-title">
        <span>DemoStudio</span>
        <span class="brand-badge">Enterprise Console</span>
      </div>
    </div>

    <div class="app-bar-center">
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input id="search-input" class="search-input" placeholder="Search product demos, websites, or tags..." spellcheck="false" />
      </div>
    </div>

    <div class="app-bar-actions">
      <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
      </button>
      <button id="create-demo-btn" class="btn-filled">
        <span class="material-symbols-outlined" style="font-size:18px;">add</span>
        <span>New Demo</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Executive KPI Metrics -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon-wrap">
          <span class="material-symbols-outlined">layers</span>
        </div>
        <div>
          <div id="stat-demos" class="metric-value">0</div>
          <div class="metric-label">Product Walkthroughs</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon-wrap">
          <span class="material-symbols-outlined">desktop_windows</span>
        </div>
        <div>
          <div id="stat-screens" class="metric-value">0</div>
          <div class="metric-label">Captured DOM Screens</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon-wrap">
          <span class="material-symbols-outlined">touch_app</span>
        </div>
        <div>
          <div id="stat-steps" class="metric-value">0</div>
          <div class="metric-label">Interactive Steps</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon-wrap">
          <span class="material-symbols-outlined">insights</span>
        </div>
        <div>
          <div id="stat-views" class="metric-value">0</div>
          <div class="metric-label">Prospect Engagement Views</div>
        </div>
      </div>
    </section>

    <!-- Filter & Toolbar -->
    <div class="toolbar-row">
      <div class="filter-chips">
        <button class="chip active" data-filter="all">All Demos</button>
        <button class="chip" data-filter="published">Published</button>
        <button class="chip" data-filter="draft">Drafts</button>
      </div>
      <div id="count-indicator" class="count-label">Loading demos...</div>
    </div>

    <!-- Demos Grid -->
    <div id="demos-grid" class="demos-grid">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Create Demo Modal -->
  <div id="create-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title">
          <span class="material-symbols-outlined" style="color:var(--md-sys-color-primary);">add_box</span>
          <span>Create Product Demo</span>
        </div>
        <button id="modal-close" class="icon-btn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="field-group">
        <label class="field-label">DEMO TITLE</label>
        <input id="demo-name-input" class="text-input" placeholder="e.g. Qlytics Analytics Platform Overview" spellcheck="false" />
      </div>

      <div class="field-group">
        <label class="field-label">TARGET APPLICATION URL</label>
        <input id="demo-url-input" class="text-input" placeholder="https://app.yourcompany.com" spellcheck="false" />
        <div class="presets-row">
          <span class="preset-pill" data-url="http://localhost:3200" data-name="PulseMetrics Local Demo">PulseMetrics (3200)</span>
          <span class="preset-pill" data-url="https://qlytics.lavenai.com" data-name="Qlytics Production Demo">Qlytics Cloud</span>
          <span class="preset-pill" data-url="https://linear.app" data-name="Linear App Tour">Linear</span>
          <span class="preset-pill" data-url="https://stripe.com" data-name="Stripe Payments Overview">Stripe</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modal-cancel" class="btn-outlined">Cancel</button>
        <button id="modal-submit" class="btn-filled">
          <span class="material-symbols-outlined" style="font-size:18px;">rocket_launch</span>
          <span>Create & Launch Studio</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let allDemos = [];
    let currentFilter = 'all';

    // Theme Management
    function initTheme() {
      const saved = localStorage.getItem('demostudio_theme') || 'light';
      const icon = document.getElementById('theme-icon');
      if (saved === 'dark') {
        document.body.classList.add('theme-dark');
        icon.textContent = 'light_mode';
      } else {
        document.body.classList.remove('theme-dark');
        icon.textContent = 'dark_mode';
      }

      document.getElementById('theme-toggle-btn').onclick = () => {
        const isDark = document.body.classList.toggle('theme-dark');
        localStorage.setItem('demostudio_theme', isDark ? 'dark' : 'light');
        icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        showToast(isDark ? 'Dark theme enabled' : 'Light theme enabled');
      };
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'flex';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { t.style.display = 'none'; }, 2400);
    }

    // Load Demos & Stats
    async function loadData() {
      try {
        const [demosRes, statsRes] = await Promise.all([
          fetch('/__tour/api/demos').then(r => r.json()),
          fetch('/__tour/api/stats').then(r => r.json())
        ]);

        if (statsRes.ok) {
          document.getElementById('stat-demos').textContent = statsRes.stats.totalDemos;
          document.getElementById('stat-screens').textContent = statsRes.stats.totalScreens;
          document.getElementById('stat-steps').textContent = statsRes.stats.totalSteps;
          document.getElementById('stat-views').textContent = statsRes.stats.totalViews;
        }

        if (demosRes.ok) {
          allDemos = demosRes.demos || [];
          renderDemos();
        }
      } catch (e) {
        console.error('Failed to load demos:', e);
        showToast('Error loading dashboard data');
      }
    }

    function renderDemos() {
      const grid = document.getElementById('demos-grid');
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();

      const filtered = allDemos.filter(d => {
        const matchFilter = currentFilter === 'all' || d.status.toLowerCase() === currentFilter;
        const matchSearch = !q || d.name.toLowerCase().includes(q) || (d.targetUrl || '').toLowerCase().includes(q);
        return matchFilter && matchSearch;
      });

      document.getElementById('count-indicator').textContent = `Showing ${filtered.length} of ${allDemos.length} demos`;

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined empty-icon">search_off</span>
            <div class="empty-title">No matching product demos found</div>
            <div class="empty-sub">Create your first demo or try a different search filter.</div>
            <button class="btn-filled" onclick="openCreateModal()">
              <span class="material-symbols-outlined" style="font-size:18px;">add</span>
              <span>Create Demo</span>
            </button>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(d => {
        let domain = '';
        try { domain = new URL(d.targetUrl).hostname; } catch(e) { domain = d.targetUrl; }
        const isPublished = d.status === 'Published';
        const dateStr = new Date(d.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

        return `
          <div class="demo-card" data-id="${d.id}">
            <div class="demo-card-head" style="background: linear-gradient(135deg, ${d.accent || '#005ac1'}22 0%, var(--md-sys-color-surface-container-high) 100%);">
              <div class="demo-card-head-top">
                <span class="demo-domain-badge">
                  <span class="material-symbols-outlined" style="font-size:13px;">public</span>
                  <span>${esc(domain)}</span>
                </span>
                <span class="demo-status-badge ${isPublished ? 'status-published' : 'status-draft'}">
                  ${d.status}
                </span>
              </div>
            </div>
            <div class="demo-card-body">
              <h3 class="demo-title">${esc(d.name)}</h3>
              <p class="demo-desc">${esc(d.description || 'Interactive product walkthrough with autonomous element tracking.')}</p>
              <div class="demo-meta-row">
                <div class="meta-item">
                  <span class="material-symbols-outlined" style="font-size:15px;">desktop_windows</span>
                  <span>${d.screensCount} screens</span>
                </div>
                <div class="meta-item">
                  <span class="material-symbols-outlined" style="font-size:15px;">ads_click</span>
                  <span>${d.stepsCount} steps</span>
                </div>
                <div class="meta-item" style="margin-left:auto;">
                  <span>Updated ${dateStr}</span>
                </div>
              </div>
              <div class="demo-card-actions">
                <div class="action-group-left">
                  <button class="btn-tonal" onclick="editDemo('${d.id}')" title="Edit in Studio proxy">
                    <span class="material-symbols-outlined" style="font-size:16px;">edit</span>
                    <span>Edit in Studio</span>
                  </button>
                  <button class="btn-outlined" onclick="playDemo('${d.id}')" title="Play standalone demo">
                    <span class="material-symbols-outlined" style="font-size:16px;">play_arrow</span>
                  </button>
                </div>
                <div>
                  <button class="icon-btn" onclick="duplicateDemo('${d.id}')" title="Duplicate demo">
                    <span class="material-symbols-outlined" style="font-size:18px;">content_copy</span>
                  </button>
                  <button class="icon-btn" onclick="deleteDemo('${d.id}')" title="Delete demo">
                    <span class="material-symbols-outlined" style="font-size:18px;">delete</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    // Actions
    function editDemo(id) {
      try {
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i);
          if (k && (k.startsWith('demostudio_draft') || k.startsWith('demostudio_studio'))) localStorage.removeItem(k);
        }
      } catch(e) {}
      location.href = `/__tour/studio/load?id=${encodeURIComponent(id)}`;
    }

    function playDemo(id) {
      window.open(`/__tour/player?id=${encodeURIComponent(id)}`, '_blank');
    }

    async function duplicateDemo(id) {
      try {
        const res = await fetch(`/__tour/api/demos/${id}/duplicate`, { method: 'POST' });
        const data = await res.json();
        if (data.ok) {
          showToast('Demo duplicated');
          loadData();
        }
      } catch (e) {
        showToast('Duplicate failed');
      }
    }

    async function deleteDemo(id) {
      if (!confirm('Are you sure you want to delete this product demo?')) return;
      try {
        const res = await fetch(`/__tour/api/demos/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
          showToast('Demo deleted');
          loadData();
        }
      } catch (e) {
        showToast('Delete failed');
      }
    }

    // Modal
    const modal = document.getElementById('create-modal');
    function openCreateModal() {
      document.getElementById('demo-name-input').value = '';
      document.getElementById('demo-url-input').value = '';
      modal.style.display = 'flex';
    }
    function closeCreateModal() {
      modal.style.display = 'none';
    }

    document.getElementById('create-demo-btn').onclick = openCreateModal;
    document.getElementById('modal-close').onclick = closeCreateModal;
    document.getElementById('modal-cancel').onclick = closeCreateModal;

    document.querySelectorAll('.preset-pill').forEach(pill => {
      pill.onclick = () => {
        document.getElementById('demo-url-input').value = pill.dataset.url;
        document.getElementById('demo-name-input').value = pill.dataset.name;
      };
    });

    document.getElementById('modal-submit').onclick = async () => {
      const name = (document.getElementById('demo-name-input').value || '').trim();
      const url = (document.getElementById('demo-url-input').value || '').trim();
      if (!name || !url) {
        alert('Please specify both a Demo Title and a Target Application URL.');
        return;
      }

      try {
        const res = await fetch('/__tour/api/demos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, targetUrl: url })
        });
        const data = await res.json();
        if (data.ok && data.demo) {
          try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
              const k = localStorage.key(i);
              if (k && (k.startsWith('demostudio_draft') || k.startsWith('demostudio_studio'))) localStorage.removeItem(k);
            }
          } catch(e) {}
          closeCreateModal();
          showToast('Demo created! Launching Studio…');
          setTimeout(() => {
            location.href = `/__tour/studio/load?id=${encodeURIComponent(data.demo.id)}`;
          }, 400);
        }
      } catch (e) {
        showToast('Failed to create demo');
      }
    };

    // Filter Chips
    document.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderDemos();
      };
    });

    // Search Input
    document.getElementById('search-input').oninput = renderDemos;

    // Init
    initTheme();
    loadData();
  </script>
</body>
</html>
